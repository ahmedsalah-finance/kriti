<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kriti</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1a1a1a; --border: #dcdfe4;
      --user: #dbeafe; --bot: #eef0f3; --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a; --card: #1e2127; --text: #e8eaed; --border: #343a44;
        --user: #1e3a5f; --bot: #2a2f38; --accent: #3b82f6;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      display: flex; justify-content: center;
    }
    #app {
      width: 100%; max-width: 760px; height: 100dvh;
      display: flex; flex-direction: column; padding: 12px;
    }
    h1 { margin: 4px 0 10px; text-align: center; font-size: 1.4rem; }
    #chat {
      flex: 1; overflow-y: auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    }
    .msg {
      margin: 8px 0; padding: 10px 14px; border-radius: 12px;
      white-space: pre-wrap; line-height: 1.6; max-width: 90%;
    }
    .user { background: var(--user); margin-inline-start: auto; }
    .bot { background: var(--bot); margin-inline-end: auto; }
    #row { display: flex; gap: 8px; margin-top: 10px; }
    #input {
      flex: 1; padding: 12px; font-size: 1rem; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    #send {
      padding: 0 20px; border: 0; border-radius: 10px; font-size: 1rem;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    #send:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Kriti</h1>
    <div id="chat"></div>
    <div id="row">
      <input id="input" placeholder="اكتب رسالتك..." autocomplete="off">
      <button id="send">إرسال</button>
    </div>
  </div>

<script>
// غيّر الرابط ده لرابط الـ Worker بتاعك بعد ما تعمله على Cloudflare
const WORKER_URL = "https://kriti-assistant.finance-0f1.workers.dev";

let token = localStorage.getItem("agent_token");
if (!token) {
  token = prompt("الباسورد:");
  if (token) localStorage.setItem("agent_token", token);
}

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const history = [];

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

add("أهلاً، أنا Kriti. اسألني أي حاجة.", "bot");

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendBtn.disabled = true;
  add(text, "user");
  history.push({ role: "user", content: text });
  const waiting = add("...", "bot");

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
      },
      body: JSON.stringify({ messages: history }),
    });
    if (res.status === 401) {
      localStorage.removeItem("agent_token");
      waiting.textContent = "الباسورد غلط، حدّث الصفحة وجرب تاني.";
      history.pop();
      return;
    }
    const { reply } = await res.json();
    history.push({ role: "assistant", content: reply });
    waiting.textContent = reply;
  } catch (e) {
    waiting.textContent = "خطأ في الاتصال: " + e.message;
    history.pop();
  } finally {
    sendBtn.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

sendBtn.onclick = send;
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
